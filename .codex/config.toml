# Project configuration for Codex. Merged with ~/.codex/config.toml; hook paths must be
# absolute because a session may start below this directory.

# The same never-safe guard Claude Code runs. The matcher is broad because Codex tool names
# differ from Claude's; the guard dispatches on the payload shape and ignores the rest.
[[hooks.PreToolUse]]
matcher = ".*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "bash /Users/fredrikburmester/Documents/GitHub/fdrive-web/tools/orchestration/guard-tool-use.sh"
