name: fdrive-dev

# Standalone local development environment. Not layered on top of
# compose.yaml: it runs only the two backing services a developer needs to
# run the api and web dev servers with hot reload on the host (Postgres and
# a seeded SFTPGo), pre-populated with the same alice/bob/carol fixtures the
# testkit uses plus a friendlier "dev" user with sample files.
#
# Usage: see docs/DEVELOPMENT.md, or the root `dev:env` / `dev:env:down` /
# `dev:env:reset` scripts.

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: fdrive
      POSTGRES_USER: fdrive
      POSTGRES_PASSWORD: fdrive-dev
    ports:
      - "${FDRIVE_DEV_DB_PORT:-55432}:5432"
    volumes:
      - fdrive-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fdrive -d fdrive"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SFTPGo copies seed files in as root, which leaves them unwritable by the
  # uid 1000 the sftpgo process runs as (see packages/testkit's
  # startSftpgo). This one-shot service copies the generated seed files into
  # the named data volume and fixes ownership before sftpgo ever starts.
  sftpgo-seed:
    image: alpine:3.20
    volumes:
      - ./dev/files:/seed-files:ro
      - fdrive-dev-sftpgo-data:/srv/sftpgo/data
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /srv/sftpgo/data
        cp -a /seed-files/. /srv/sftpgo/data/
        chown -R 1000:1000 /srv/sftpgo/data

  sftpgo:
    image: drakkan/sftpgo:v2.7.5
    ports:
      - "${FDRIVE_DEV_SFTPGO_HTTP_PORT:-58080}:8080"
      - "${FDRIVE_DEV_SFTPGO_SFTP_PORT:-52022}:2022"
      # SFTPGo's own WebDAV binding: the dev target for the WebDAV provider.
      - "${FDRIVE_DEV_SFTPGO_WEBDAV_PORT:-58082}:8081"
    environment:
      SFTPGO_HTTPD__BINDINGS__0__PORT: "8080"
      SFTPGO_HTTPD__BINDINGS__0__ADDRESS: ""
      SFTPGO_WEBDAVD__BINDINGS__0__PORT: "8081"
      SFTPGO_WEBDAVD__BINDINGS__0__ADDRESS: ""
      SFTPGO_LOADDATA_FROM: /seed/sftpgo-seed.json
      SFTPGO_LOADDATA_MODE: "0"
      SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: "true"
      SFTPGO_DEFAULT_ADMIN_USERNAME: admin
      SFTPGO_DEFAULT_ADMIN_PASSWORD: admin-dev-password
    volumes:
      - ./dev/sftpgo-seed.json:/seed/sftpgo-seed.json:ro
      - fdrive-dev-sftpgo-data:/srv/sftpgo/data
    depends_on:
      sftpgo-seed:
        condition: service_completed_successfully
    healthcheck:
      # The image ships neither curl nor wget; sftpgo's own "ping"
      # subcommand exists specifically for environments like this one.
      test: ["CMD", "sftpgo", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Index profile: indexer, tika, embed. Opt in with `--profile index` so a
  # plain `docker compose -f compose.dev.yaml up -d` stays fast. Mounts the same
  # named volume sftpgo writes its seed files into (read-only), so the indexer
  # sees exactly what the dev SFTPGo user sees. Thumbnails are bind-mounted to
  # a host directory (not a named volume) so the api dev server on the host
  # can read the generated WebP files directly.
  indexer:
    build:
      context: ../services/indexer
      dockerfile: Dockerfile
    profiles: [index]
    environment:
      DATABASE_URL: postgres://fdrive:fdrive-dev@db:5432/fdrive
      INDEX_ROOTS: sftpgo=/roots/sftpgo
      TIKA_URL: http://tika:9998
      EMBED_URL: http://embed:80
      # Optional, like OCR: set so a local dev stack exercises the image
      # embedding pass once services/indexer reads it (image-embed-db
      # chunk); unset means the feature reports not_configured, same as
      # every other optional sidecar.
      IMAGE_EMBED_URL: http://image-embed:8012
      THUMBS_DIR: /thumbs
      INDEXER_PORT: "8010"
      SCAN_INTERVAL_SECONDS: "30"
      # Match compose.yaml: one tesseract thread per extraction, so INDEX_WORKERS
      # is the concurrency bound rather than a multiplier on it.
      OMP_THREAD_LIMIT: "1"
    ports:
      - "${FDRIVE_DEV_INDEXER_HTTP_PORT:-58010}:8010"
    volumes:
      - fdrive-dev-sftpgo-data:/roots/sftpgo:ro
      - ${FDRIVE_DEV_THUMBS_DIR:-./dev/.data/thumbs}:/thumbs
    depends_on:
      db:
        condition: service_healthy
      sftpgo:
        condition: service_healthy

  tika:
    image: apache/tika:3.2.1.0
    ports:
      - "127.0.0.1:${FDRIVE_DEV_TIKA_PORT:-59998}:9998"
    profiles: [index]

  # Published on the host so the api dev server (running with `tsx watch` on
  # the host, not in this compose stack) can reach it directly for semantic
  # search, matching FDRIVE_EMBED_URL in apps/api/.env.dev.
  embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    platform: linux/amd64 # this image ships amd64 only; emulated on arm64 hosts
    profiles: [index]
    command: ["--model-id", "intfloat/multilingual-e5-small"]
    environment:
      # Match compose.yaml: unset, TEI takes a tokenization worker per core on
      # top of the image's RAYON_NUM_THREADS=8.
      RAYON_NUM_THREADS: ${FDRIVE_EMBED_THREADS:-4}
      TOKENIZATION_WORKERS: ${FDRIVE_EMBED_THREADS:-4}
    ports:
      - "${FDRIVE_DEV_EMBED_PORT:-58081}:80"
    volumes:
      - fdrive-dev-embed-models:/data
    mem_limit: 4g
    # The emulated amd64 TEI image is the first casualty of memory pressure (exit 137);
    # come back on its own instead of leaving search "Unreachable" until someone notices.
    restart: unless-stopped

  # Nightly OCR pass, same `index` profile as the indexer. Mounts the dev
  # SFTPGo data volume read-write (the indexer mounts it read-only), so a
  # manually triggered `POST /run` can actually rewrite a scanned PDF. The
  # seed's `dev/docs/sample.pdf` already has a text layer, so a run reports it
  # skipped rather than OCR'd.
  ocr:
    build:
      context: ../services/ocr
      dockerfile: Dockerfile
    profiles: [index]
    environment:
      DATABASE_URL: postgres://fdrive:fdrive-dev@db:5432/fdrive
      INDEX_ROOTS: sftpgo=/roots/sftpgo
      OCR_PORT: "8011"
      STATE_DIR: /state
      OCR_RUN_ON_START: "false"
      # Let a developer exercise the include/exclude glob feature locally
      # without editing this file; unset by default (no restriction).
      OCR_EXCLUDE_GLOBS: ${OCR_EXCLUDE_GLOBS:-}
      OCR_INCLUDE_GLOBS: ${OCR_INCLUDE_GLOBS:-}
    ports:
      - "${FDRIVE_DEV_OCR_HTTP_PORT:-58011}:8011"
    volumes:
      - fdrive-dev-sftpgo-data:/roots/sftpgo
      - fdrive-dev-ocr-state:/state
    depends_on:
      db:
        condition: service_healthy
      sftpgo:
        condition: service_healthy

  # SigLIP 2 image/text embedding sidecar for image search (see
  # services/image-embed/README.md), same `index` profile as the
  # indexer. Published on the host, like `embed` above, so the api dev
  # server (running with `tsx watch` on the host) can reach it directly once
  # FDRIVE_IMAGE_EMBED_URL is wired up. The named volume at /models caches
  # the downloaded model weights across restarts, matching the indexer's
  # HF_HOME convention. No database dependency: this service is stateless.
  image-embed:
    build:
      context: ../services/image-embed
      dockerfile: Dockerfile
    profiles: [index]
    environment:
      IMAGE_EMBED_PORT: "8012"
      IMAGE_EMBED_THREADS: ${FDRIVE_IMAGE_EMBED_THREADS:-4}
      OMP_NUM_THREADS: ${FDRIVE_IMAGE_EMBED_THREADS:-4}
    ports:
      - "${FDRIVE_DEV_IMAGE_EMBED_PORT:-58012}:8012"
    volumes:
      - fdrive-dev-image-embed-models:/models
    mem_limit: 6g
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8012/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # A local S3 target for the S3 provider: MinIO with one bucket and one
  # read-write key, prepared by the `mc` client the image ships. Add it under
  # System > Storage as http://localhost:59000/fdrive and sign in with the
  # access key `fdrive-dev` and secret `fdrive-dev-password`.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: [s3]
    ports:
      - "${FDRIVE_DEV_MINIO_PORT:-59000}:9000"
      - "${FDRIVE_DEV_MINIO_CONSOLE_PORT:-59001}:9001"
    environment:
      MINIO_ROOT_USER: minio-root
      MINIO_ROOT_PASSWORD: minio-root-password
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - fdrive-dev-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-seed:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: [s3]
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 minio-root minio-root-password
        mc mb --ignore-existing local/fdrive
        mc admin user add local fdrive-dev fdrive-dev-password || true
        mc admin policy attach local readwrite --user fdrive-dev || true
    depends_on:
      minio:
        condition: service_healthy

volumes:
  fdrive-dev-pgdata:
  fdrive-dev-sftpgo-data:
  fdrive-dev-minio-data:
  fdrive-dev-embed-models:
  fdrive-dev-ocr-state:
  fdrive-dev-image-embed-models:
