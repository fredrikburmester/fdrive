name: fdrive-dev

# Standalone local development environment. Not layered on top of
# compose.yaml: it runs only what a developer needs beside the api and web dev
# servers running with hot reload on the host. The api serves dev/.data/files
# itself (FDRIVE_STORAGE_ROOT in apps/api/.env.dev): a gitignored copy of the
# committed dev/files seed, with the alice/bob/carol homes the testkit uses
# plus a friendlier "dev" home with sample files. `pnpm dev:env` makes the copy
# and `pnpm dev:users` creates those users with known passwords.
#
# Usage: see docs/DEVELOPMENT.md, or the root `dev:env` / `dev:env:down` /
# `dev:env:reset` scripts.

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: fdrive
      POSTGRES_USER: fdrive
      POSTGRES_PASSWORD: fdrive-dev
    ports:
      - "${FDRIVE_DEV_DB_PORT:-55432}:5432"
    volumes:
      - fdrive-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fdrive -d fdrive"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Index profile: indexer, ml, ocr. Opt in with `--profile index` so a
  # plain `docker compose -f compose.dev.yaml up -d` stays fast. Mounts the
  # folder the api dev server serves (read-only) at /data under the root name
  # production uses, so the indexer sees exactly what the dev users see.
  # Thumbnails are bind-mounted to a host directory (not a named volume) so the
  # api dev server on the host can read the generated WebP files directly.
  indexer:
    build:
      context: ../services/indexer
      dockerfile: Dockerfile
    profiles: [index]
    environment:
      DATABASE_URL: postgres://fdrive:fdrive-dev@db:5432/fdrive
      INDEX_ROOTS: files=/data
      # The three units of the ml service below.
      TIKA_URL: http://ml:8080/extract
      EMBED_URL: http://ml:8080/text
      # Optional, like OCR: unset means the feature reports not_configured.
      IMAGE_EMBED_URL: http://ml:8080/image
      THUMBS_DIR: /thumbs
      INDEXER_PORT: "8010"
      SCAN_INTERVAL_SECONDS: "30"
      # Match compose.yaml: one tesseract thread per extraction, so INDEX_WORKERS
      # is the concurrency bound rather than a multiplier on it.
      OMP_THREAD_LIMIT: "1"
    ports:
      - "${FDRIVE_DEV_INDEXER_HTTP_PORT:-58010}:8010"
    volumes:
      - ./dev/.data/files:/data:ro
      - ${FDRIVE_DEV_THUMBS_DIR:-./dev/.data/thumbs}:/thumbs
    depends_on:
      db:
        condition: service_healthy

  # One server for document text extraction, text embeddings and image
  # embeddings (services/ml), same `index` profile as the indexer. Published
  # on the host so the api dev server (running with `tsx watch` on the host,
  # not in this compose stack) reaches each unit under its path prefix,
  # matching FDRIVE_TIKA_URL, FDRIVE_EMBED_URL and FDRIVE_IMAGE_EMBED_URL in
  # apps/api/.env.dev. Every unit is always on here: production instead
  # follows the owner's feature settings (FDRIVE_WORKER_TOKEN). The named
  # volume keeps the downloaded models (about 3.1 GB) across restarts.
  ml:
    build:
      context: ../services/ml
      dockerfile: Dockerfile
    profiles: [index]
    environment:
      FDRIVE_ML_STATIC_UNITS: text,image,extract
      # Match compose.yaml: unset, model inference takes every core.
      FDRIVE_ML_THREADS: ${FDRIVE_ML_THREADS:-4}
    ports:
      - "127.0.0.1:${FDRIVE_DEV_ML_PORT:-58012}:8080"
    volumes:
      - fdrive-dev-ml-models:/models
    mem_limit: 6g
    restart: unless-stopped

  # Nightly OCR pass, same `index` profile as the indexer. Mounts the served
  # dev files folder read-write (the indexer mounts it read-only), so a manually
  # triggered `POST /run` can actually rewrite a scanned PDF. The seed's
  # `dev/docs/sample.pdf` already has a text layer, so a run reports it
  # skipped rather than OCR'd.
  ocr:
    build:
      context: ../services/ocr
      dockerfile: Dockerfile
    profiles: [index]
    environment:
      DATABASE_URL: postgres://fdrive:fdrive-dev@db:5432/fdrive
      INDEX_ROOTS: files=/data
      OCR_PORT: "8011"
      STATE_DIR: /state
      OCR_RUN_ON_START: "false"
      # Let a developer exercise the include/exclude glob feature locally
      # without editing this file; unset by default (no restriction).
      OCR_EXCLUDE_GLOBS: ${OCR_EXCLUDE_GLOBS:-}
      OCR_INCLUDE_GLOBS: ${OCR_INCLUDE_GLOBS:-}
    ports:
      - "${FDRIVE_DEV_OCR_HTTP_PORT:-58011}:8011"
    volumes:
      - ./dev/.data/files:/data
      - fdrive-dev-ocr-state:/state
    depends_on:
      db:
        condition: service_healthy

volumes:
  fdrive-dev-pgdata:
  fdrive-dev-ocr-state:
  fdrive-dev-ml-models:
