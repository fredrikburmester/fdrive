name: fdrive

# Core stack: proxy, web, api, db. SFTPGo is expected to already exist
# somewhere reachable from `api` (see README.md and
# compose.sftpgo-network.example.yaml). Only people who have no SFTPGo yet
# should add compose.sftpgo.yaml on top of this file.

# Shared json-file log rotation for every service below: without a limit,
# a long-running container's logs grow unbounded on the host disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  proxy:
    image: caddy:2@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d
    ports:
      # Reach onboarding from another device using the server's IP address.
      # Set FDRIVE_HTTP_BIND=127.0.0.1 for an explicitly local-only deployment.
      - "${FDRIVE_HTTP_BIND:-0.0.0.0}:${FDRIVE_HTTP_PORT:-8090}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    # The official image's caddy binary carries a `cap_net_bind_service`
    # file capability so it can bind :80 without running fully privileged;
    # `cap_drop: [ALL]` also strips that capability from the container's
    # bounding set (verified: caddy fails to exec at all without it, with
    # "operation not permitted"), so it is the one capability added back.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    pids_limit: 512
    read_only: true
    # /tmp for general scratch space; /config and /data are where Caddy
    # would persist its autosave config and TLS/ACME state, neither of
    # which this deployment uses (see README.md's TLS section: no
    # automatic HTTPS, no on-disk certificate cache), so a tmpfs is enough
    # to stop it logging "read-only file system" on every start.
    tmpfs: ["/tmp", "/config/caddy", "/data/caddy"]
    logging: *default-logging

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:3001
        FDRIVE_OFFICE_PUBLIC_URL: ${FDRIVE_OFFICE_PUBLIC_URL:-}
    environment:
      API_INTERNAL_URL: http://api:3001
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 512
    read_only: true
    tmpfs: ["/tmp"]
    logging: *default-logging

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment: &api-environment
      # Fixed by this compose topology, not operator-configurable through
      # .env: secrets, and sidecar addresses only reachable inside the
      # compose network. FDRIVE_THUMBS_DIR, FDRIVE_OCR_URL, FDRIVE_INDEXER_URL,
      # FDRIVE_EMBED_URL, and FDRIVE_IMAGE_EMBED_URL point to
      # managed worker processes are always present but start no processing
      # or model loading until the owner enables a feature in the walkthrough.
      FDRIVE_THUMBS_DIR: /thumbs
      FDRIVE_DESKTOP_STATE_DIR: /var/lib/fdrive/desktop
      FDRIVE_BACKUP_STATE_DIR: /var/lib/fdrive/backups
      FDRIVE_BACKUP_WORKER: "false"
      FDRIVE_BACKUP_SOURCES: '[{"kind":"ocr","path":"/backup-sources/ocr"},{"kind":"logs","path":"/backup-sources/logs"},{"kind":"office","path":"/backup-sources/office"}]'
      DATABASE_URL: postgres://fdrive:${POSTGRES_PASSWORD}@db:5432/fdrive
      SFTPGO_URL: ${SFTPGO_URL:-}
      FDRIVE_MASTER_KEY: ${FDRIVE_MASTER_KEY}
      FDRIVE_SETUP_TOKEN: ${FDRIVE_SETUP_TOKEN:-}
      # Reuse the database secret only inside the private compose network as
      # the worker/API authentication token; no extra operator secret exists.
      FDRIVE_WORKER_TOKEN: ${POSTGRES_PASSWORD}
      PORT: "3001"
      NODE_ENV: production
      FDRIVE_OCR_URL: http://ocr:8011
      FDRIVE_INDEXER_URL: http://indexer:8010
      FDRIVE_EMBED_URL: http://embed:80
      FDRIVE_IMAGE_EMBED_URL: http://image-embed:8012
      FDRIVE_EMBED_RUNTIME_URL: ${FDRIVE_EMBED_RUNTIME_URL:-http://embed:8099}
      FDRIVE_IMAGE_EMBED_RUNTIME_URL: ${FDRIVE_IMAGE_EMBED_RUNTIME_URL:-http://image-embed:8013}
      FDRIVE_TIKA_RUNTIME_URL: ${FDRIVE_TIKA_RUNTIME_URL:-http://tika:9997}
      FDRIVE_TIKA_URL: ${FDRIVE_TIKA_URL:-http://tika:9998}

      # ONLYOFFICE is bundled in this stack. The owner enables it and chooses
      # the browser-facing origin in onboarding. Explicit overrides support
      # an externally managed Office installation.
      FDRIVE_OFFICE_PRODUCT: ${FDRIVE_OFFICE_PRODUCT:-onlyoffice}
      FDRIVE_OFFICE_URL: ${FDRIVE_OFFICE_URL:-http://onlyoffice}
      FDRIVE_WOPI_URL: ${FDRIVE_WOPI_URL:-http://api:3001/wopi}
      # The conventional shipped mount remains fixed. The walkthrough may
      # choose scopes below it, but cannot add arbitrary host mounts at runtime.
      FDRIVE_INDEX_ROOTS: '[{"name":"sftpgo","sftpgoPath":"${FDRIVE_INDEX_SFTPGO_PATH:-/srv/sftpgo/data}","indexerPath":"/roots/sftpgo"}]'
      # BEGIN GENERATED CONFIG KEYS (tools/deploy/generate-env-example.ts)
      FDRIVE_RESTORE_MODE: ${FDRIVE_RESTORE_MODE:-}
      HOST: ${HOST:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      FDRIVE_HOME_TEMPLATE: ${FDRIVE_HOME_TEMPLATE:-}
      FDRIVE_SESSION_TTL_DAYS: ${FDRIVE_SESSION_TTL_DAYS:-}
      FDRIVE_SESSION_MAX_AGE_DAYS: ${FDRIVE_SESSION_MAX_AGE_DAYS:-}
      FDRIVE_COOKIE_SECURE: ${FDRIVE_COOKIE_SECURE:-}
      FDRIVE_TRUSTED_PROXY_HOPS: ${FDRIVE_TRUSTED_PROXY_HOPS:-}
      FDRIVE_AUTO_MIGRATE: ${FDRIVE_AUTO_MIGRATE:-}
      FDRIVE_TMP_DIR: ${FDRIVE_TMP_DIR:-}
      FDRIVE_JOB_MAX_BYTES: ${FDRIVE_JOB_MAX_BYTES:-}
      FDRIVE_JSON_MAX_BYTES: ${FDRIVE_JSON_MAX_BYTES:-}
      FDRIVE_ARCHIVE_PEEK_MAX_BYTES: ${FDRIVE_ARCHIVE_PEEK_MAX_BYTES:-}
      FDRIVE_SHARE_UPLOAD_MAX_BYTES: ${FDRIVE_SHARE_UPLOAD_MAX_BYTES:-}
      FDRIVE_ADMIN_USERS: ${FDRIVE_ADMIN_USERS:-}
      FDRIVE_MCP_WRITES: ${FDRIVE_MCP_WRITES:-}
      FDRIVE_OFFICE_PUBLIC_URL: ${FDRIVE_OFFICE_PUBLIC_URL:-}
      FDRIVE_OFFICE_MAX_BYTES: ${FDRIVE_OFFICE_MAX_BYTES:-}
      FDRIVE_OFFICE_EDIT_RULES: ${FDRIVE_OFFICE_EDIT_RULES:-}
      # END GENERATED CONFIG KEYS
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - fdrive-thumbs:/thumbs:ro
      - fdrive-desktop:/var/lib/fdrive/desktop
      - fdrive-backups:/var/lib/fdrive/backups
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 512
    logging: *default-logging

  backup:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/main.js", "backup", "worker"]
    environment:
      <<: *api-environment
    # Source state has different owners and may be mode 0600. The worker can
    # read it, but source mounts are read-only. No Docker socket or host root.
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, CHOWN]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - fdrive-backups:/var/lib/fdrive/backups
      - fdrive-desktop:/var/lib/fdrive/desktop:ro
      - ${FDRIVE_DATA_DIR:-./data}/ocr:/backup-sources/ocr:ro
      - fdrive-indexer-logs:/backup-sources/logs:ro
      - office_onlyoffice_data:/backup-sources/office:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped
    stop_grace_period: 65s
    pids_limit: 128
    logging: *default-logging

  db:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_DB: fdrive
      POSTGRES_USER: fdrive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${FDRIVE_DATA_DIR:-./data}/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fdrive -d fdrive"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    # docker-entrypoint.sh runs as root first to fix ownership/permissions
    # on the data directory, then drops to the "postgres" user before
    # starting the server; verified each of these five is required (the
    # image's own entrypoint script fails without them) and no more:
    # CHOWN/FOWNER/DAC_OVERRIDE for the permission fixup, SETUID/SETGID to
    # actually switch users afterward.
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, SETUID, SETGID, DAC_OVERRIDE]
    pids_limit: 512
    logging: *default-logging

  # -- bundled optional workers -------------------------------------------------
  # Every controller/worker is included in the fixed stack. They are inert by
  # default and reconcile the owner's persisted feature choices at runtime;
  # No Docker socket or compose profile is needed to enable a feature later.
  # Models download on first activation and remain cached for reuse. Host mounts remain a deployment concern.
  #
  # `fdrive-thumbs` (below) is a named volume, not a host bind mount: Docker
  # always creates a bind-mounted host directory owned by root, which the
  # indexer's non-root uid (FDRIVE_INDEX_UID, default 1000 to match SFTPGo so
  # 700 folders stay readable) could not then write into. `thumbs-init` chowns
  # the named volume to that uid once,
  # before the indexer starts, the same one-shot pattern
  # deploy/compose.dev.yaml's `sftpgo-seed` uses for SFTPGo's own data
  # volume. Thumbnails are never operator-facing (only the api and indexer
  # ever read or write them), so a named volume loses nothing an operator
  # would otherwise want from a host-visible directory.
  thumbs-init:
    image: alpine:3.20
    volumes:
      - fdrive-thumbs:/thumbs
    command: ["chown", "-R", "${FDRIVE_INDEX_UID:-1000}:${FDRIVE_INDEX_UID:-1000}", "/thumbs"]
    logging: *default-logging

  indexer-logs-init:
    image: alpine:3.21
    user: "0:0"
    volumes:
      - fdrive-indexer-logs:/logs
    command: ["chown", "-R", "${FDRIVE_INDEX_UID:-1000}:${FDRIVE_INDEX_UID:-1000}", "/logs"]
    logging: *default-logging

  indexer:
    build:
      context: ../services/indexer
      dockerfile: Dockerfile
      args:
        INDEXER_UID: ${FDRIVE_INDEX_UID:-1000}
        INDEXER_GID: ${FDRIVE_INDEX_UID:-1000}
    environment:
      DATABASE_URL: postgres://fdrive:${POSTGRES_PASSWORD}@db:5432/fdrive
      # Legacy operator mounts keep their conventional root. Managed mode
      # suppresses all scans until a feature is selected; the fallback mount
      # below makes a fresh no-storage install safe.
      INDEX_ROOTS: sftpgo=/roots/sftpgo
      TIKA_URL: http://tika:9998
      EMBED_URL: http://embed:80
      # Optional, like OCR: unset means the indexer never embeds
      # thumbnails and image search reports not_configured.
      IMAGE_EMBED_URL: http://image-embed:8012
      THUMBS_DIR: /thumbs
      INDEXER_PORT: "8010"
      INDEXER_LOG_DIR: /logs
      # pytesseract spawns the tesseract binary, which parallelises over every
      # core through OpenMP. INDEX_WORKERS already runs several extractions at
      # once, so without this each of them multiplies again: two OCR files were
      # observed at 240% and 215% CPU, and the indexer as a whole at 581% on a
      # 12-core host. One thread per process makes INDEX_WORKERS the honest
      # concurrency bound; OCR throughput is unchanged because the parallelism
      # simply moves up a level.
      OMP_THREAD_LIMIT: "1"
    volumes:
      - ${FDRIVE_INDEX_SFTPGO_DIR:-./data/roots/sftpgo}:/roots/sftpgo:ro
      - fdrive-thumbs:/thumbs
      - fdrive-indexer-logs:/logs
    depends_on:
      indexer-logs-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      thumbs-init:
        condition: service_completed_successfully
    mem_limit: ${FDRIVE_INDEXER_MEMORY:-0}
    cpus: ${FDRIVE_INDEXER_CPUS:-0}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 512
    logging: *default-logging

  # Initialize the backup directory's ownership before the non-root OCR worker
  # needs to retain an original. Never change ownership of the source files.
  ocr-state-init:
    image: alpine:3.20
    volumes:
      - ${FDRIVE_DATA_DIR:-./data}/ocr:/state
    command: ["chown", "1000:1000", "/state"]
    logging: *default-logging

  # PDF-rewriting OCR is independently controlled by its explicit pdfOcr
  # setting. It stays alive for diagnostics while disabled.
  # layers for scanned PDFs (see docs/OCR.md). Needs read-write access to the
  # roots (the indexer only needs read-only) and its own state directory for
  # kept originals; the API's System page talks to it over `FDRIVE_OCR_URL`.
  ocr:
    build:
      context: ../services/ocr
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://fdrive:${POSTGRES_PASSWORD}@db:5432/fdrive
      INDEX_ROOTS: sftpgo=/roots/sftpgo
      OCR_PORT: "8011"
      STATE_DIR: /state
      TZ: ${TZ:-UTC}
      OCR_EXCLUDE_GLOBS: ${OCR_EXCLUDE_GLOBS:-}
      # Restricts OCR to the given globs when set, e.g. "fredrik/**" for a
      # single-user instance; see deploy/.env.example. OCR_EXCLUDE_GLOBS
      # still applies on top. Empty (the default) means no restriction.
      OCR_INCLUDE_GLOBS: ${OCR_INCLUDE_GLOBS:-}
    volumes:
      - ${FDRIVE_INDEX_SFTPGO_DIR:-./data/roots/sftpgo}:/roots/sftpgo
      - ${FDRIVE_DATA_DIR:-./data}/ocr:/state
    depends_on:
      db:
        condition: service_healthy
      ocr-state-init:
        condition: service_completed_successfully
    mem_limit: ${FDRIVE_OCR_MEMORY:-0}
    cpus: ${FDRIVE_OCR_CPUS:-0}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 512
    logging: *default-logging

  tika:
    init: true
    build:
      context: ..
      dockerfile: deploy/runtime/Dockerfile.tika
    environment:
      FDRIVE_WORKER_TOKEN: ${POSTGRES_PASSWORD}
      FDRIVE_RUNTIME_FEATURES: textSearch,searchOcr,semanticSearch
      FDRIVE_RUNTIME_PORT: "9997"
      FDRIVE_RUNTIME_READY_URL: http://127.0.0.1:9998/version
      # The JVM sizes its heap and its GC threads from what it can see. Under a
      # container memory limit it sees the limit; with none it sees the host.
      JAVA_TOOL_OPTIONS: ${FDRIVE_TIKA_JAVA_OPTS:-}
    mem_limit: ${FDRIVE_TIKA_MEMORY:-0}
    cpus: ${FDRIVE_TIKA_CPUS:-0}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 512
    logging: *default-logging

  embed:
    init: true
    # Pinned to an explicit version (not :cpu-latest) plus digest, see
    # deploy/REFERENCE.md's pins table.
    build:
      context: ..
      dockerfile: deploy/runtime/Dockerfile.tei
    platform: linux/amd64 # this image ships amd64 only; emulated on arm64 hosts
    command: ["text-embeddings-router", "--model-id", "intfloat/multilingual-e5-small"]
    environment:
      FDRIVE_WORKER_TOKEN: ${POSTGRES_PASSWORD}
      FDRIVE_RUNTIME_FEATURES: semanticSearch
      FDRIVE_RUNTIME_PORT: "8099"
      FDRIVE_RUNTIME_READY_URL: http://127.0.0.1:80/health
      # TEI sizes both pools from the host's visible core count: one tokenization
      # worker per core, plus the RAYON_NUM_THREADS=8 baked into the upstream
      # image. On a 12-core host that is 19 threads and enough load to make the
      # host itself unreachable while every container still reports healthy,
      # because mem_limit bounds memory and nothing bounds CPU. Keep the default
      # below the core count of a small host so indexing never costs the operator
      # their shell; raise FDRIVE_EMBED_THREADS on a dedicated machine.
      RAYON_NUM_THREADS: ${FDRIVE_EMBED_THREADS:-4}
      TOKENIZATION_WORKERS: ${FDRIVE_EMBED_THREADS:-4}
    volumes:
      - ${FDRIVE_DATA_DIR:-./data}/models:/data
    mem_limit: ${FDRIVE_EMBED_MEMORY:-4g}
    # A hard cap on top of the thread counts. 0 means no limit, and the value
    # must not exceed the host's core count, so this stays opt-in via .env.
    cpus: ${FDRIVE_EMBED_CPUS:-0}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    # Binds :80 as root; verified this image does not need
    # CAP_NET_BIND_SERVICE added back to do so (unlike caddy, whose binary
    # carries a file capability that requires it even for root; this
    # server's own bind call does not).
    cap_drop: [ALL]
    pids_limit: 512
    logging: *default-logging

  # SigLIP 2 image/text embedding sidecar for image search (see
  # services/image-embed/README.md), same `index` profile as the
  # indexer. Talks to the api over FDRIVE_IMAGE_EMBED_URL, and to the indexer
  # (which embeds each thumbnail as it is generated) over IMAGE_EMBED_URL.
  # The named volume at /models caches the downloaded model weights across
  # restarts, matching the indexer's HF_HOME convention. No database
  # dependency: this service is stateless.
  image-embed:
    init: true
    build:
      context: ..
      dockerfile: deploy/runtime/Dockerfile.image-embed
    environment:
      IMAGE_EMBED_PORT: "8012"
      FDRIVE_WORKER_TOKEN: ${POSTGRES_PASSWORD}
      FDRIVE_RUNTIME_FEATURES: imageSearch
      FDRIVE_RUNTIME_PORT: "8013"
      FDRIVE_RUNTIME_READY_URL: http://127.0.0.1:8012/health
      # Same reasoning as `embed` above: unset, torch takes every core.
      IMAGE_EMBED_THREADS: ${FDRIVE_IMAGE_EMBED_THREADS:-4}
      OMP_NUM_THREADS: ${FDRIVE_IMAGE_EMBED_THREADS:-4}
    volumes:
      - fdrive-image-embed-models:/models
    mem_limit: ${FDRIVE_IMAGE_EMBED_MEMORY:-6g}
    cpus: ${FDRIVE_IMAGE_EMBED_CPUS:-0}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 512
    logging: *default-logging

  # Document Server is included in the normal stack, but its small controller
  # leaves every editor daemon stopped until the owner enables ONLYOFFICE in
  # onboarding. Disabling it stops nginx, supervisor, and the editor workers;
  # no Docker socket or Compose profile is involved.
  onlyoffice:
    init: true
    build:
      context: ..
      dockerfile: deploy/office/Dockerfile.onlyoffice
    environment:
      WOPI_ENABLED: "true"
      JWT_ENABLED: "true"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "false"
      NODE_CONFIG: '{"wopi":{"wopiZone":"external-https"},"services":{"CoAuthoring":{"request-filtering-agent":{"allowMetaIPAddress":false}}}}'
      FDRIVE_WORKER_TOKEN: ${POSTGRES_PASSWORD}
      FDRIVE_RUNTIME_PORT: "8099"
      FDRIVE_OFFICE_SETTINGS_URL: http://api:3001/api/v1/internal/office
      FDRIVE_OFFICE_READY_URL: http://127.0.0.1/hosting/discovery
    volumes:
      - office_onlyoffice_data:/var/www/onlyoffice/Data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8099/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 65s
    mem_limit: ${FDRIVE_ONLYOFFICE_MEMORY:-0}
    cpus: ${FDRIVE_ONLYOFFICE_CPUS:-0}
    restart: unless-stopped
    pids_limit: 512
    logging: *default-logging

volumes:
  fdrive-backups:
  fdrive-desktop:
  fdrive-indexer-logs:
  fdrive-thumbs:
  fdrive-image-embed-models:
  office_onlyoffice_data:
