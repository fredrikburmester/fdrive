name: fdrive

# Core stack: proxy, web, api, db. SFTPGo is expected to already exist
# somewhere reachable from `api` (see README.md and
# compose.sftpgo-network.example.yaml). Only people who have no SFTPGo yet
# should add compose.sftpgo.yaml on top of this file.

services:
  proxy:
    image: caddy:2
    ports:
      - "${FDRIVE_HTTP_PORT:-8090}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:3001
    environment:
      API_INTERNAL_URL: http://api:3001
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://fdrive:${POSTGRES_PASSWORD}@db:5432/fdrive
      SFTPGO_URL: ${SFTPGO_URL}
      FDRIVE_MASTER_KEY: ${FDRIVE_MASTER_KEY}
      FDRIVE_HOME_TEMPLATE: ${FDRIVE_HOME_TEMPLATE}
      FDRIVE_SESSION_TTL_DAYS: ${FDRIVE_SESSION_TTL_DAYS:-30}
      FDRIVE_COOKIE_SECURE: ${FDRIVE_COOKIE_SECURE:-auto}
      FDRIVE_PUBLIC_URL: ${FDRIVE_PUBLIC_URL:-}
      PORT: "3001"
      # Reachable only when the `index` profile is up; the api treats a
      # connection failure as "OCR status unknown" rather than an error.
      FDRIVE_OCR_URL: http://ocr:8011
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: fdrive
      POSTGRES_USER: fdrive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${FDRIVE_DATA_DIR:-./data}/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fdrive -d fdrive"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # -- index profile: indexer, tika, embed --------------------------------------
  # Opt in with `--profile index` (see README.md). The indexer walks and watches
  # `FDRIVE_INDEX_SFTPGO_DIR` (a read-only bind mount of the same directory
  # SFTPGo serves), extracts text, embeds it, and generates thumbnails. Add more
  # roots by copying the `indexer` service's volume line and `INDEX_ROOTS` entry
  # for each additional `name=/roots/<name>` pair.
  indexer:
    build:
      context: ../services/indexer
      dockerfile: Dockerfile
    profiles: [index]
    environment:
      DATABASE_URL: postgres://fdrive:${POSTGRES_PASSWORD}@db:5432/fdrive
      INDEX_ROOTS: sftpgo=/roots/sftpgo
      TIKA_URL: http://tika:9998
      EMBED_URL: http://embed:80
      THUMBS_DIR: /thumbs
      INDEXER_PORT: "8010"
    volumes:
      - ${FDRIVE_INDEX_SFTPGO_DIR}:/roots/sftpgo:ro
      - ${FDRIVE_DATA_DIR:-./data}/thumbs:/thumbs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Nightly OCR pass over the same roots the indexer reads, filling in text
  # layers for scanned PDFs (see docs/OCR.md). Needs read-write access to the
  # roots (the indexer only needs read-only) and its own state directory for
  # kept originals; the API's System page talks to it over `FDRIVE_OCR_URL`.
  ocr:
    build:
      context: ../services/ocr
      dockerfile: Dockerfile
    profiles: [index]
    environment:
      DATABASE_URL: postgres://fdrive:${POSTGRES_PASSWORD}@db:5432/fdrive
      INDEX_ROOTS: sftpgo=/roots/sftpgo
      OCR_PORT: "8011"
      STATE_DIR: /state
      TZ: ${TZ:-UTC}
    volumes:
      - ${FDRIVE_INDEX_SFTPGO_DIR}:/roots/sftpgo
      - ${FDRIVE_DATA_DIR:-./data}/ocr:/state
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  tika:
    image: apache/tika:3.2.1.0
    profiles: [index]
    restart: unless-stopped

  embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    platform: linux/amd64 # this image ships amd64 only; emulated on arm64 hosts
    profiles: [index]
    command: ["--model-id", "intfloat/multilingual-e5-small"]
    volumes:
      - ${FDRIVE_DATA_DIR:-./data}/models:/data
    mem_limit: 4g
    restart: unless-stopped
