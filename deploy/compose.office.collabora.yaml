# Advanced Collabora alternative to bundled ONLYOFFICE. Enable Office in the UI.
services:
  collabora-keys:
    extends:
      file: office/compose.services.yaml
      service: collabora-keys
    profiles: [collabora]
  collabora:
    extends:
      file: office/compose.services.yaml
      service: collabora
    profiles: [collabora]
    depends_on:
      collabora-keys:
        condition: service_completed_successfully
  api:
    environment:
      FDRIVE_OFFICE_PRODUCT: collabora
      FDRIVE_OFFICE_URL: http://collabora:9980
      FDRIVE_OFFICE_PUBLIC_URL: https://${FDRIVE_COLLABORA_HOST}
      FDRIVE_WOPI_URL: http://api:3001/wopi
      FDRIVE_OFFICE_MAX_BYTES: ${FDRIVE_OFFICE_MAX_BYTES:-104857600}
      FDRIVE_OFFICE_EDIT_RULES: ${FDRIVE_OFFICE_EDIT_RULES:-[]}
  # The separate Collabora origin must be allowed by the browser CSP, which the
  # web image bakes in at build time, so this overlay builds web from the checkout.
  web:
    image: fdrive-web:collabora
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:3001
        FDRIVE_OFFICE_PUBLIC_URL: https://${FDRIVE_COLLABORA_HOST}
  proxy:
    environment:
      FDRIVE_COLLABORA_HOST: ${FDRIVE_COLLABORA_HOST}
    volumes:
      - ./office/Caddyfile.collabora:/etc/caddy/Caddyfile:ro
volumes:
  office_collabora_keys:
