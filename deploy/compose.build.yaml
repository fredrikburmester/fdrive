# Builds fdrive's images from this checkout instead of pulling the published
# ones, for development, forks and a web image that allows an external Office
# origin (FDRIVE_OFFICE_PUBLIC_URL is baked into the browser CSP at build time).
# Add it to FDRIVE_COMPOSE_FILES in .env; update.sh then builds instead of pulls.
# Builds need several GB of memory and take a while on small hosts.
#
# On ARM64 hosts also add compose.arm64.yaml, or the embedding runtime builds
# from upstream's amd64-only image and runs emulated.

services:
  proxy:
    image: fdrive-proxy:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.proxy

  web:
    image: fdrive-web:local
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:3001
        FDRIVE_OFFICE_PUBLIC_URL: ${FDRIVE_OFFICE_PUBLIC_URL:-}

  api:
    image: fdrive-api:local
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        FDRIVE_BUILD_REVISION: ${FDRIVE_BUILD_REVISION:-}

  backup:
    image: fdrive-api:local
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        FDRIVE_BUILD_REVISION: ${FDRIVE_BUILD_REVISION:-}

  indexer:
    image: fdrive-indexer:local
    build:
      context: ../services/indexer
      dockerfile: Dockerfile
      args:
        INDEXER_UID: ${FDRIVE_INDEX_UID:-1000}
        INDEXER_GID: ${FDRIVE_INDEX_UID:-1000}

  ocr:
    image: fdrive-ocr:local
    build:
      context: ../services/ocr
      dockerfile: Dockerfile

  tika:
    image: fdrive-tika:local
    build:
      context: ..
      dockerfile: deploy/runtime/Dockerfile.tika

  embed:
    image: fdrive-embed:local
    build:
      context: ..
      dockerfile: deploy/runtime/Dockerfile.tei
    platform: linux/amd64

  image-embed:
    image: fdrive-image-embed:local
    build:
      context: ..
      dockerfile: deploy/runtime/Dockerfile.image-embed

  onlyoffice:
    image: fdrive-onlyoffice:local
    build:
      context: ..
      dockerfile: deploy/office/Dockerfile.onlyoffice
