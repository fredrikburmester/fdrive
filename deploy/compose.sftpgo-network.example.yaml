# Attaches fdrive's API to the Docker network your SFTPGo container is on, so
# fdrive can reach it by container name. Save it next to compose.yaml as
# compose.sftpgo-network.yaml, set the network's name, and list both files in
# .env:
#
#   COMPOSE_FILE=compose.yaml:compose.sftpgo-network.yaml
#
# Run `docker compose up -d`, then enter SFTPGo's address on that network, such
# as http://sftpgo:8080, during setup.

services:
  api:
    networks:
      - default
      - sftpgo
networks:
  sftpgo:
    external: true
    name: replace-with-sftpgo-network
