[package]
name = "fdrive-indexer"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "Walks and watches fdrive's storage roots, extracts and embeds text, and builds thumbnails"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5.17"
encoding_rs = "0.8.44"
fast_image_resize = { version = "6.1.0", features = ["image"] }
file-rotate = "0.8.0"
globset = "0.4.21"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "avif-native"] }
jpeg-decoder = { version = "0.3.2", default-features = false }
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_17"] }
mime_guess = "2.0.5"
mupdf = { version = "0.8.0", default-features = false, features = ["base14-fonts"] }
pgvector = { version = "0.4.2", features = ["postgres"] }
postgres = { version = "0.19.14", features = ["with-chrono-0_4", "with-serde_json-1"] }
rawler = { version = "0.8.0", default-features = false }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "multipart"] }
rustix = { version = "1.1.6", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
uuid = { version = "1.29.2", features = ["v4"] }
webp = { version = "0.3.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
inotify = { version = "0.11.5", default-features = false }

[dev-dependencies]
testcontainers = { version = "0.28.0", features = ["blocking", "reusable-containers"] }
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
