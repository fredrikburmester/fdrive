[project]
name = "fdrive-indexer"
version = "0.1.0"
description = "fdrive index, watch, extract, embed and thumbnail service"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pymupdf>=1.24",
  "pytesseract>=0.3.13",
  "Pillow>=10",
  "pillow-heif>=0.18",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "starlette>=0.37",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "testcontainers[postgres]>=4.7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/fdrive_indexer"]
branch = true

[tool.coverage.report]
precision = 2
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# pymupdf, pytesseract, and Pillow ship incomplete or partial type stubs, so calls
# into them from our (fully typed) wrapper functions trip strict's
# disallow_untyped_calls. The wrapper functions themselves are still fully typed
# and checked; only the boundary calls into these three libraries are relaxed.
[[tool.mypy.overrides]]
module = ["fdrive_indexer.extract", "fdrive_indexer.thumbs_io"]
disallow_untyped_calls = false

# pillow-heif re-exports its public API (register_heif_opener and friends) from
# submodules without listing it in __all__, which strict's implicit_reexport
# rejects. Treat those imports as the exports the library documents them as.
[[tool.mypy.overrides]]
module = ["pillow_heif"]
implicit_reexport = true
