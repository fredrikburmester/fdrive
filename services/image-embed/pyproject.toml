[project]
name = "fdrive-image-embed"
version = "0.1.0"
description = "fdrive image embedding sidecar: turns images and text into SigLIP 2 vectors for image search"
requires-python = ">=3.12"
dependencies = [
  "uvicorn>=0.30",
  "starlette>=0.37",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# torch, transformers, and pillow: only needed to load and run the real
# model. Kept out of the base dependencies (and out of `dev`) so the test
# venv never installs or imports them; the Dockerfile installs this extra
# from the PyTorch CPU wheel index. See `src/fdrive_image_embed/siglip.py`.
runtime = [
  "torch>=2.3",
  "transformers>=4.44",
  "pillow>=10.4",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/fdrive_image_embed"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
