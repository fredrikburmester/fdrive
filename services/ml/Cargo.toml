[package]
name = "fdrive-ml"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "One server for fdrive's text embeddings, image embeddings and document text extraction"

[workspace]
members = ["extract"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
fdrive-ml-extract = { path = "extract" }
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
ort = "=2.0.0-rc.15"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
