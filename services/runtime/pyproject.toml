[project]
name = "fdrive-runtime"
version = "0.1.0"
description = "Fail-closed lifecycle controller for fdrive's bundled optional workers"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/fdrive_runtime"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.",
  "raise NotImplementedError",
  "def fetch",
  "class NoRedirect",
  "def _child_ready",
  "class RuntimeServer",
  "class RuntimeHandler",
  "def serve_status",
  "def run",
  "def main",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
