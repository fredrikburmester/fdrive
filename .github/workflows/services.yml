# Python service checks, path-filtered. CI (full) also calls this workflow.
name: Python services

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'services/ocr/**'
      - 'services/runtime/**'
      - '.github/workflows/services.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: services-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: OCR (Python), service: ocr, module: fdrive_ocr }
          - { name: Python (runtime), service: runtime, module: fdrive_runtime }
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests $([[ -d scripts ]] && echo scripts)
      - run: mypy src $([[ -d scripts ]] && echo scripts)
      - run: pytest -q --cov=${{ matrix.module }} --cov-report=term-missing --cov-fail-under=95
