# The complete suite: everything the old single CI workflow ran, ~30 billed
# minutes a run (see the budget note in ci.yml). Opt in per pull request by
# adding the `ci:full` label (the label event starts it and every later push
# keeps it running), or dispatch it by hand for any ref:
#   gh workflow run "CI (full)" --ref main
# On pull requests without the label every job is skipped at no cost.
name: CI (full)

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm bootstrap
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage

  integration:
    name: Integration tests
    needs: check
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm bootstrap
      - run: pnpm test:integration

  e2e:
    name: End-to-end tests
    needs: check
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm bootstrap
      - run: pnpm --filter @fdrive/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # The images an operator actually builds. `check` type-checks the sources, but
  # nothing else here runs `next build` or exercises the Dockerfiles' build
  # context, so a break that only surfaces during the image build reached
  # self-hosters as a failed `./update.sh` with no attribution to upstream.
  images:
    name: Deployment images
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: API_INTERNAL_URL=http://api:3001
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  python:
    name: Python services
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    uses: ./.github/workflows/services.yml
