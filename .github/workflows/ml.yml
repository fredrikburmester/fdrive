# Rust checks for the ML server, path-filtered. CI (full) also calls this workflow.
name: ML server

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'services/ml/**'
      - '.github/workflows/ml.yml'
  workflow_call:
    inputs:
      probes:
        description: Also run the probes against the real models, which download about 3 GB
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      probes:
        description: Also run the probes against the real models, which download about 3 GB
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ml-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: ML server (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/ml
    env:
      CARGO_TERM_COLOR: always
      CARGO_LLVM_COV_VERSION: 0.9.1
    steps:
      - uses: actions/checkout@v4
      # rustup reads services/ml/rust-toolchain.toml and installs that toolchain
      # with rustfmt, clippy and the coverage tools.
      - run: rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-llvm-cov
            services/ml/target
          key: ml-${{ runner.os }}-${{ hashFiles('services/ml/rust-toolchain.toml', 'services/ml/Cargo.lock') }}
          restore-keys: ml-${{ runner.os }}-
      - run: command -v cargo-llvm-cov || cargo install cargo-llvm-cov --locked --version "$CARGO_LLVM_COV_VERSION"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The model backends and the entrypoint need real weights to run; the
      # README says how they are probed instead.
      - run: cargo llvm-cov --workspace --locked --fail-under-lines 95 --ignore-filename-regex '(src/onnx/|src/main\.rs)'
      - name: Image builds
        run: docker build -t fdrive-ml:ci .

  # The unit tests never load a model. This runs both real ones on the
  # runner's CPU: the text vectors must match what text-embeddings-inference
  # produced, and the 8-bit image tower, whose arithmetic takes a different
  # code path per CPU family, must stay close to vectors recorded on ARM.
  probes:
    name: ML server (real models)
    if: inputs.probes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: services/ml
    env:
      CARGO_TERM_COLOR: always
      FDRIVE_ML_MODELS_DIR: ${{ github.workspace }}/.ml-models
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ml-models
          key: ml-models-${{ hashFiles('services/ml/src/hub.rs') }}
      - name: CPU of this runner
        run: |
          lscpu | grep 'Model name'
          grep -o -E 'avx2|avx512f|avx512_vnni|avx_vnni' /proc/cpuinfo | sort -u | tr '\n' ' '
      - run: cargo test --release --locked --test models -- --ignored --nocapture
