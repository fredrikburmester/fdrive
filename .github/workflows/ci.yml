# The repository is public, so standard hosted runners cost nothing; the split
# below keeps pull request feedback fast rather than saving minutes. (It was a
# private repository until 2026-09-23 and hit its minutes limit on 2026-09-12.)
#
# This workflow is the default gate: lint, typecheck and unit coverage on pull
# requests, roughly 8 minutes a run. Docs-only changes skip it and a newer push
# cancels the previous run. Everything heavier is opt-in or path-filtered:
#   - `Python services` runs only when a Python service changes;
#   - `Images` builds the deployment images when an image definition changes,
#     and publishes them from main and from release tags;
#   - `CI (full)` runs integration, browser, Python and image builds when a PR
#     carries the `ci:full` label or when dispatched by hand;
#   - `Performance budgets` and `Real Office editors` are manual only.
# This workflow does not run on push to main: run `gh workflow run CI --ref main`
# (or the full suite) after a direct commit you want checked.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm bootstrap
      - run: pnpm lint
      - run: pnpm typecheck
      # `pnpm test:coverage` minus the web package, which gets its own runner
      # below: its jsdom suites time out beside the others on four cores.
      - run: pnpm turbo run test:coverage --filter='!@fdrive/web' && pnpm test:coverage:tools

  web:
    name: Web coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm bootstrap
      - run: pnpm --filter @fdrive/web test:coverage
