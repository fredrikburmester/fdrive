# Actions budget: this is a private repository on GitHub's free plan, which
# includes 2000 hosted minutes a month. In the 30 days to 2026-09-12 the repo
# billed ~2500 minutes and hit the spending limit: every run of the previous
# single workflow cost ~30 minutes across seven jobs, 60 % of runs were
# push-to-main duplicates of the pull request run for the same commit, and
# rapid pushes stacked instead of cancelling. Keep that in mind before adding
# triggers or jobs here.
#
# This workflow is the cheap default gate: lint, typecheck and unit coverage on
# pull requests, roughly 8 billed minutes a run. Docs-only changes skip it and a
# newer push cancels the previous run. Everything heavier is opt-in:
#   - `Python services` runs only when services/indexer or services/ocr change;
#   - `CI (full)` runs integration, browser, Python and image builds when a PR
#     carries the `ci:full` label or when dispatched by hand;
#   - `Performance budgets` and `Real Office editors` are manual only.
# Nothing runs on push to main: run `gh workflow run CI --ref main` (or the
# full suite) after a direct commit you want checked.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.claude/**'
      - '.codex/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: bash tools/orchestration/setup-checkout.sh .
      - run: bash tools/orchestration/verify.sh . application
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-helper-logs
          path: .fdrive-workflow/logs/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
