name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  workflow:
    name: Workflow helpers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: bash tools/orchestration/setup-checkout.sh .
      - run: bash tools/orchestration/verify.sh . workflow
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-helper-logs
          path: .fdrive-workflow/logs/**
          include-hidden-files: true
          if-no-files-found: warn

  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: bash tools/orchestration/setup-checkout.sh .
      - run: bash tools/orchestration/verify.sh . application
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            **/coverage/lcov.info
            **/coverage/coverage-summary.json
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-helper-logs
          path: .fdrive-workflow/logs/**
          include-hidden-files: true
          if-no-files-found: warn

  integration:
    name: Integration tests
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: bash tools/orchestration/setup-checkout.sh .
      - run: bash tools/orchestration/verify.sh . integration
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-helper-logs
          path: .fdrive-workflow/logs/**
          include-hidden-files: true
          if-no-files-found: warn

  indexer:
    name: Indexer (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install indexer system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-swe ffmpeg
      - run: bash tools/orchestration/setup-python.sh . indexer
        env:
          FDRIVE_PYTHON: python
      - run: bash tools/orchestration/verify.sh . python indexer
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: indexer-helper-logs
          path: .fdrive-workflow/logs/**
          include-hidden-files: true
          if-no-files-found: warn

  ocr:
    name: OCR (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash tools/orchestration/setup-python.sh . ocr
        env:
          FDRIVE_PYTHON: python
      - run: bash tools/orchestration/verify.sh . python ocr
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-helper-logs
          path: .fdrive-workflow/logs/**
          include-hidden-files: true
          if-no-files-found: warn

  e2e:
    name: End-to-end tests
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: bash tools/orchestration/setup-checkout.sh .
      - run: pnpm --filter @fdrive/web exec playwright install --with-deps chromium
      - run: bash tools/orchestration/verify.sh . browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-helper-logs
          path: .fdrive-workflow/logs/**
          include-hidden-files: true
          if-no-files-found: warn
