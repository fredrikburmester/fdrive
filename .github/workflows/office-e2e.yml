name: Real Office editors

# Manual only since 2026-09-12: the nightly schedule alone cost ~35 billed
# minutes a day on a 2000-minute monthly budget (see ci.yml). Dispatch it for a
# branch that touches the Office integration:
#   gh workflow run "Real Office editors" --ref <branch>
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: office-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor:
    name: ${{ matrix.product }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        product: [onlyoffice, collabora]
    env:
      OFFICE_E2E_PRODUCT: ${{ matrix.product }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.11.0"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install fixture system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 openssh-client
          docker compose version
      - name: Install Playwright Chromium
        run: pnpm --filter @fdrive/web exec playwright install --with-deps chromium
      - name: Check Office fixture coverage
        run: pnpm --filter @fdrive/web exec vitest run --coverage --config office-e2e/vitest.config.ts
      - name: Run the real editor suite
        run: pnpm test:e2e:office
