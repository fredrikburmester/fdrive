name: macOS release

on:
  push:
    tags: ["macos-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "App version (three numbers, e.g. 0.1.0). Builds an artifact without publishing."
        required: true
        type: string

permissions:
  contents: read

# Releases run one at a time, so each numbers its build after the one published
# before it. GitHub keeps only one waiting run per group, so push one tag at a time.
concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  # File Provider refuses to upgrade to a lower build, so every build takes the
  # next number after the last published Mac release's build.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.plan.outputs.proceed }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $GITHUB_EVENT_NAME == push ]] && gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::$GITHUB_REF_NAME is already published; nothing to build."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | { grep '^macos-v' || true; } | grep -vFx "$GITHUB_REF_NAME" | sort -V | tail -n 1)
          build=0
          if [[ -n $previous ]]; then
            build=$(gh release download "$previous" --repo "$GITHUB_REPOSITORY" --pattern release.json --output - | jq -r .build)
            if [[ ! $build =~ ^[0-9]+$ ]]; then
              echo "::error::$previous has no build number in its release.json"
              exit 1
            fi
          fi
          echo "::notice::Build $((build + 1)) follows build $build of ${previous:-no earlier release}."
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "build=$((build + 1))" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.proceed == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release version and source
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            VERSION=${GITHUB_REF_NAME#macos-v}
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          else
            VERSION=$INPUT_VERSION
          fi
          python3 -c 'import sys; sys.path.insert(0, "tools/macos"); from release import version_value; version_value(sys.argv[1])' "$VERSION"
          echo "FDRIVE_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm bootstrap
      - run: python3 -m unittest discover -s tools/macos -p 'test_*.py'
      - run: swift test --package-path apps/macos --scratch-path .fdrive-workflow/swift-build
      - name: Install signing credentials
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ vars.MACOS_NOTARY_ISSUER_ID }}
          MACOS_APP_PROFILE_BASE64: ${{ secrets.MACOS_APP_PROFILE_BASE64 }}
          MACOS_EXTENSION_PROFILE_BASE64: ${{ secrets.MACOS_EXTENSION_PROFILE_BASE64 }}
        run: python3 tools/macos/ci-signing.py
      - name: Archive, sign, notarize and package
        env:
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
          MACOS_LICENSE_ORGANIZATION: ${{ vars.MACOS_LICENSE_ORGANIZATION }}
          MACOS_PURCHASE_URL: ${{ vars.MACOS_PURCHASE_URL }}
          FDRIVE_RELEASE_BUILD: ${{ needs.plan.outputs.build }}
        run: |
          python3 tools/macos/release.py release \
            --version "$FDRIVE_RELEASE_VERSION" --build "$FDRIVE_RELEASE_BUILD" \
            --team "$MACOS_TEAM_ID" --keychain "$FDRIVE_SIGNING_KEYCHAIN" \
            --app-profile "$RUNNER_TEMP/fdrive-signing/app.provisionprofile" \
            --extension-profile "$RUNNER_TEMP/fdrive-signing/extension.provisionprofile" \
            --license-organization "$MACOS_LICENSE_ORGANIZATION" --purchase-url "$MACOS_PURCHASE_URL" \
            --output .fdrive-workflow/macos-release
      - uses: actions/upload-artifact@v4
        with:
          name: fdrive-macos-release
          path: .fdrive-workflow/macos-release/artifacts/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/fdrive-signing/signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/fdrive-signing/signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/fdrive-signing/certificate.p12"
          rm -f "$RUNNER_TEMP/fdrive-signing/notary.p8"
          rm -f "$RUNNER_TEMP/fdrive-signing/app.provisionprofile" "$RUNNER_TEMP/fdrive-signing/extension.provisionprofile"

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fdrive-macos-release
          path: release-artifacts
      - id: existing
        name: Check for a release published while this run built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::$GITHUB_REF_NAME was published while this run built; leaving it as it is."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish GitHub release and propose Homebrew update
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # The run summary shows the release and the cask PR, or the link to open it
        # when the repository does not let Actions create pull requests.
        run: |
          set -o pipefail
          python3 tools/macos/publish.py --repo "$GITHUB_REPOSITORY" --artifacts release-artifacts \
            | tee -a "$GITHUB_STEP_SUMMARY"
