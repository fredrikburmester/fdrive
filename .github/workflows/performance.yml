# Manual only since 2026-09-12: ~7 billed minutes a run on every pull request
# and push to main was part of exhausting the Actions budget (see ci.yml).
#   gh workflow run "Performance budgets" --ref <branch>
name: Performance budgets
on:
  workflow_dispatch:
concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  budgets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fdrive/web exec playwright install --with-deps chromium
      - run: pnpm test:perf:coverage
      - run: pnpm perf:strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-observations
          path: tools/perf/results/*.json
          if-no-files-found: error
          retention-days: 7
