name: Performance budgets
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  budgets:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fdrive/web exec playwright install --with-deps chromium
      - run: pnpm test:perf:coverage
      - run: pnpm perf:strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-observations
          path: tools/perf/results/*.json
          if-no-files-found: error
