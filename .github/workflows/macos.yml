# Opt-in, for changes to the native app: an unsigned build plus Swift tests on a macOS runner.
name: macOS native

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm bootstrap
      - run: swift test --package-path apps/macos --scratch-path .fdrive-workflow/swift-build
      - run: >-
          xcodebuild -project apps/macos/fdrive.xcodeproj -scheme fdrive -configuration Debug
          -derivedDataPath .fdrive-workflow/macos-build-unsigned -destination 'platform=macOS,arch=arm64'
          build CODE_SIGNING_ALLOWED=NO
